<div class="progress-card">

    <h2>Scan Progress</h2>

    <div class="progress-row">
        <span>Target</span>
        <span id="progress-target">-</span>
    </div>

    <div class="progress-row">
        <span>Status</span>
        <span id="progress-status">Ready</span>
    </div>

    <div class="progress-row">
        <span>Progress</span>
        <span id="progress-percent">0%</span>
    </div>

    <progress id="scan-progress" value="0" max="100">
    </progress>

    <div class="progress-row">
        <span>Current Port</span>
        <span id="current-port">0</span>
    </div>

    <div class="progress-row">
        <span>Elapsed</span>
        <span id="elapsed-time">00:00:00</span>
    </div>

</div>
