<div id="instagram-card" class="platform-card">
    <div class="platform-header">
        <h2 style="background: -webkit-linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Instagram</h2>

        <span id="instagram-status">
            waiting..
        </span>
    </div>

    <div class="platform-body">
        <img id="instagram-avatar" src="" alt="Avatar">

        <h3 id="instagram-name">...</h3>

        <p id="instagram-username">@-</p>

        <p id="instagram-bio">No bio</p>

        <div class="stats">
            <div>
                <strong id="instagram-followers">0</strong>
                <span>Followers</span>
            </div>
            <div>
                <strong id="instagram-following">0</strong>
                <span>Following</span>
            </div>
            <div>
                <strong id="instagram-verified">No</strong>
                <span>Verified</span>
            </div>
        </div>

        <a id="instagram-profile" href="#" target="_blank">
            Open Instagram Profile
        </a>
    </div>
</div>
