<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Intelligence</title>

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/network.css">
</head>

<body>

    <div id="sidebar"></div>
    <div id="topbar"></div>

    <div class="dashboard">
        <h1>N-I</h1>

        <div id="network-search"></div>

        <div id="network-progress"></div>

        <div class="live-status">

            <span id="live-dot">*</span>

            <span id="live-text">Not monitoring</span>

            <span id="last-check">-</span>
        </div>

        <div id="ping-card" class="network-card">

            <h2>Ip Address</h2>

            <div id="ip-status">
                waiting ......
            </div>

            <div id="ip-value">-</div>

            <br>

            <h2>Ping Status</h2>

            <div id="ping-status">
                waiting ......
            </div>

            <div id="ping-value">-</div>

            <div class="ping-row">
                <span>Packets</span>
                <strong id="ping-packets">-</strong>
            </div>

            <div class="ping-row">
                <span>Packet Loss</span>
                <strong id="ping-loss">-</strong>
            </div>

            <div class="ping-row">
                <span>Minimum</span>
                <strong id="ping-min">-</strong>
            </div>

            <div class="ping-row">
                <span>Average</span>
                <strong id="ping-average">-</strong>
            </div>

            <div class="ping-row">
                <span>Maximum</span>
                <strong id="ping-max">-</strong>
            </div>

        </div>
    </div>

    <script src="js/load-components.js"></script>
    <script src="js/network.js"></script>
</body>

</html>
